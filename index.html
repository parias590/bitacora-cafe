<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de Café</title>
<meta name="description" content="Registro de preparaciones de café con valoración de cata y sugerencias de receta.">
<meta name="theme-color" content="#F1F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Café">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: app de una columna para móvil, cabecera fija, barra de pestañas inferior; ficha de cata como unidad visual */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --sunk:#E6E8E2; --line:#D5D8D0;
  --ink:#1D1B18; --muted:#666A61; --accent:#9E2338; --accent-ink:#FFFFFF; --accent-soft:#F4DEE2;
  --water:#2F6F8F;
  --s-low:#B4553C; --s-mid:#C78A1E; --s-good:#6E8B2E; --s-top:#2F6B3A;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --surface:#201B17; --sunk:#2A241F; --line:#3A322B;
  --ink:#EFE8E0; --muted:#A79C90; --accent:#E25B70; --accent-ink:#1A0E10; --accent-soft:#3D2027;
  --water:#6FB3D3;
  --s-low:#D7775E; --s-mid:#E2A540; --s-good:#9DB653; --s-top:#5FB474; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120F; --surface:#201B17; --sunk:#2A241F; --line:#3A322B;
  --ink:#EFE8E0; --muted:#A79C90; --accent:#E25B70; --accent-ink:#1A0E10; --accent-soft:#3D2027;
  --water:#6FB3D3;
  --s-low:#D7775E; --s-mid:#E2A540; --s-good:#9DB653; --s-top:#5FB474; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:-.01em}
.hdr{display:flex;align-items:center;gap:4px;min-width:0}
.sync{border:0;background:none;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;text-align:right;padding:6px 8px;border-radius:999px;font-weight:600;line-height:1.2}
.sync.act{background:var(--accent);color:var(--accent-ink)}
.sync.warn{color:var(--s-low)}
.gear{border:0;background:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.gear[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.9rem}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){min-width:0;overflow-wrap:anywhere}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0;text-wrap:balance}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.view{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.banner b{font-weight:700}
section.block{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input.in,.field input,.field textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--mono);font-size:1rem}
.field textarea{font-family:var(--body);min-height:76px;resize:vertical}
.field input::placeholder,.field textarea::placeholder,input.in::placeholder{color:var(--muted);opacity:.7}
.field.txt input{font-family:var(--body)}
.field input[type="date"]{font-family:var(--body);min-height:46px}
.ratio{display:flex;align-items:baseline;justify-content:space-between;background:var(--sunk);border-radius:10px;padding:10px 12px}
.ratio .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.score button{aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--mono);font-weight:600;font-size:.95rem;padding:0}
.score button.on{color:#fff;border-color:transparent}
.taste{display:grid;grid-template-columns:5.2rem 1fr;align-items:center;gap:8px 10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-family:var(--mono);font-size:.85rem}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale-ends{grid-column:2;display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:-4px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:9px;font-weight:600}
.btn.danger{background:var(--s-low);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1}
.hint{font-size:.82rem;color:var(--muted)}
.age{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
/* vertidos */
.pours{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:600;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper .n{font-family:var(--mono);font-size:1.3rem;font-weight:600;min-width:2ch;text-align:center}
.ptable{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 3.6rem;gap:6px 8px;align-items:center}
.ptable .h{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ptable .lbl{font-weight:600;font-size:.88rem;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ptable .lbl i{width:8px;height:8px;border-radius:50%;background:var(--water);flex:none}
.ptable .lbl.bloom i{background:var(--accent)}
.ptable input.in{padding:9px 8px;font-size:.95rem;text-align:center}
.ptable .fixed{font-family:var(--mono);text-align:center;color:var(--muted);font-size:.95rem}
.ptable .cum{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pcheck{font-size:.84rem;display:flex;flex-direction:column;gap:8px}
.pcheck.warn{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.pchart{width:100%;height:auto;display:block}
.pchart text{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
/* historial */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.entry{border-bottom:1px solid var(--line)}
.entry>button.head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;cursor:pointer}
.badge{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:1.1rem;color:#fff}
.e-title{font-weight:600;display:flex;justify-content:space-between;gap:8px;min-width:0}
.e-title span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-date{font-size:.78rem;color:var(--muted);font-weight:500;white-space:nowrap}
.recipe{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.detail{padding:0 0 14px 56px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bars{display:grid;grid-template-columns:4.6rem 1fr 1.2rem;gap:4px 8px;align-items:center;font-size:.82rem}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.notes{font-size:.9rem;white-space:pre-wrap}
.empty{padding:28px 0;color:var(--muted);text-align:left}
/* sugerencias */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sug{display:flex;flex-direction:column}
.sug-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px dashed var(--line)}
.sug-row:first-child{border-top:0;padding-top:0}
.sug-row .k{font-weight:600}
.sug-row .v{font-family:var(--mono);font-size:1.15rem;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sug-row .adj{grid-column:1/-1;font-size:.78rem;color:var(--accent);font-weight:600}
.sug-row .meta{grid-column:1/-1;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.conf{display:inline-flex;gap:3px;align-items:center}
.conf i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.conf i.on{background:var(--ink)}
.diag{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.diag li{padding-left:14px;position:relative;font-size:.92rem}
.eqi{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:10px;align-items:baseline}
.eqi>span:last-child{font-weight:600}
.curcof{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.curcof b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.curcof.none{background:var(--accent-soft);border-color:transparent;justify-content:space-between}
.curcof .btn{flex:0 0 auto}
.bean{flex:none;width:12px;height:18px;border-radius:50%;background:var(--accent);transform:rotate(30deg)}
.uses{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:10px 10px;align-items:baseline}
.uses .um{font-weight:600;font-size:.88rem}
.uses .uc{display:flex;flex-direction:column;min-width:0}
.uses .uc b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname{font-family:var(--display);font-size:1.1rem}
.chip:disabled{opacity:.45;cursor:default}
.roastline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:end}
.roastline .chips{flex-wrap:nowrap;gap:6px}
.roastline .chip{padding:7px 10px}
.roastline input[type="date"]{font-family:var(--body);font-size:.92rem;padding:10px 8px;min-height:44px}
.base{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.autov{background:var(--sunk);border-radius:10px;padding:11px 8px;font-family:var(--mono);font-weight:600;font-size:1rem;min-height:46px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.tg{display:grid;grid-template-columns:3.4rem repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.tg .ph{font-size:.78rem;font-weight:700;text-align:center;line-height:1.2}
.tg .ph.stop{color:var(--accent)}
.tg .track{grid-column:2/5;position:relative;height:22px}
.tg .bar{position:absolute;left:16.66%;right:50%;top:10px;height:3px;background:var(--water);border-radius:2px}
.tg .drip{position:absolute;left:50%;right:16.67%;top:10px;height:3px;background:repeating-linear-gradient(90deg,var(--water) 0 5px,transparent 5px 9px)}
.tg .dot{position:absolute;top:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--water);transform:translateX(-50%)}
.tg .dot.stop{background:var(--accent);border-color:var(--accent);width:21px;height:21px;top:1px}
.tg .dot.end{background:var(--water)}
.tg .rl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tg .na{text-align:center;color:var(--line);font-family:var(--mono)}
.tg .unit{position:relative;min-width:0}
.tg .unit input{width:100%;min-width:0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 20px 11px 6px;font-family:var(--mono);font-size:1rem}
.tg .unit span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb .hbh{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;font-weight:600;margin-bottom:5px}
.hb .hbh .hint{font-weight:500;text-align:right}
.hbt{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.hbt i{display:block;height:100%;background:var(--accent);border-radius:6px}
.fresh-mini{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0}
.fresh-mini .fresh-age{font-size:1.25rem}
.card.comp{border-color:var(--s-mid)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;position:relative}
.tile .ti{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ti svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .tv{font-family:var(--mono);font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .tl2{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.15}
.tile.adj::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--s-mid)}
.tile[aria-expanded="true"]{background:var(--ink);border-color:var(--ink)}
.tile[aria-expanded="true"] .tv{color:var(--bg)}.tile[aria-expanded="true"] .tl2{color:var(--bg);opacity:.75}
.tdet{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.tdet .adj{font-size:.8rem;color:var(--accent);font-weight:600}
.tdet .dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.84rem}
.tdet .dl span:nth-child(odd){color:var(--muted)}
.card .sub{font-weight:700;font-size:.88rem;margin-top:4px}
.tag2{font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:auto;margin-right:8px;white-space:nowrap}
.guide{border-top:1px dashed var(--line);padding-top:10px}
.guide:first-of-type{border-top:0;padding-top:0}
.guide summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-family:var(--mono);color:var(--accent);font-weight:600}
.guide[open] summary::after{content:"–"}
.guide p{margin:8px 0 0;font-size:.9rem}
.scan{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.scanbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:11px 12px;font-weight:600;font-size:.92rem;cursor:pointer}
.camov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.camov video{flex:1;width:100%;height:100%;object-fit:contain}
.camguide{position:absolute;left:6%;right:6%;top:32%;height:26%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center}
.camguide span{transform:translateY(-130%);color:#fff;font-weight:600;font-size:.9rem;text-shadow:0 1px 3px #000}
.cambar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.cambar .btn{flex:1}.cambar .btn.ghost{background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.5)}
.scanbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linejoin:round}
.scanres{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px}
.scanres img{width:92px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.scanres.warn{background:var(--accent-soft);font-size:.9rem}
.scanv{display:grid;grid-template-columns:auto auto;gap:2px 12px;align-items:baseline}
.scanv b{font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tsum{font-family:var(--mono);font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.tsum b{color:var(--ink)}
.diag .src{color:var(--muted);font-size:.8rem;font-weight:500}
.xrow{display:flex;flex-direction:column;gap:6px}
.xrow .chips{gap:6px}
.xrow .chip{padding:6px 11px;font-size:.84rem}
.xtags{display:flex;flex-wrap:wrap;gap:6px}
.xtags span{font-size:.76rem;background:var(--sunk);border-radius:999px;padding:3px 9px}
.xtags span.warn{background:var(--accent-soft)}
.diag li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.fresh-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fresh-age{font-family:var(--mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:#fff}
.switch{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:500}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

<script>
(function(){
/* Lector de básculas con pantalla de 7 segmentos (todo en el móvil, sin enviar la foto a ningún sitio).
   readScale(imageBitmap|HTMLImageElement|canvas, {crop}) -> {fields:[...], time:segundos|null, weight:g|null, debug} */
const ScaleOCR=(()=>{
  const SEG={ "1111110":"0","0110000":"1","1101101":"2","1111001":"3","0110011":"4","1011011":"5","1011111":"6","1110000":"7","1110010":"7","1111111":"8","1111011":"9","1111111":"8","0011111":"6","1110011":"9"};
  // orden de segmentos: a b c d e f g
  function decode(bits){if(SEG[bits])return SEG[bits];let best=null,bd=9;for(const k in SEG){let d=0;for(let i=0;i<7;i++)if(k[i]!==bits[i])d++;if(d<bd){bd=d;best=SEG[k]}}return bd<=1?best:"?"}
  function toCanvas(src,crop,maxW){
    const sw=src.naturalWidth||src.videoWidth||src.width,sh=src.naturalHeight||src.videoHeight||src.height;
    const c=crop||{x:0,y:0,w:sw,h:sh};const k=Math.min(1,maxW/c.w);
    const cv=document.createElement("canvas");cv.width=Math.round(c.w*k);cv.height=Math.round(c.h*k);
    cv.getContext("2d").drawImage(src,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height);return cv;
  }
  function mask(cv){
    const W=cv.width,H=cv.height,d=cv.getContext("2d").getImageData(0,0,W,H).data;const m=new Uint8Array(W*H);
    // 1) dígitos azulados o blancos sobre fondo oscuro
    const hb=new Uint32Array(256);let nb=0;for(let p=0;p<d.length;p+=4){const r=d[p],g=d[p+1],b=d[p+2];if(b>=r+12&&g>=r){hb[Math.min(g,b)]++;nb++}}
    let acc=0,top=255;for(let v=255;v>0;v--){acc+=hb[v];if(acc>=W*H*.004){top=v;break}}
    const T=Math.max(85,Math.min(135,top*.62));
    let n=0;for(let i=0,p=0;i<m.length;i++,p+=4){const r=d[p],g=d[p+1],b=d[p+2];if(b>T&&g>T&&b>=r+12){m[i]=1;n++}}
    if(n<W*H*0.0015){ // 2) pantallas blancas, rojas o verdes: píxeles muy brillantes
      const L=new Float32Array(W*H);const hist=new Uint32Array(256);
      for(let i=0,p=0;i<m.length;i++,p+=4){const v=Math.max(d[p],d[p+1],d[p+2]);L[i]=v;hist[v]++}
      let acc=0,thr=250;for(let v=255;v>0;v--){acc+=hist[v];if(acc>W*H*0.02){thr=Math.max(170,v);break}}
      for(let i=0;i<m.length;i++)m[i]=L[i]>=thr?1:0;
    }
    return{m,W,H};
  }
  function components({m,W,H}){
    const lab=new Int32Array(W*H);const comps=[];const st=[];
    for(let i=0;i<m.length;i++){if(!m[i]||lab[i])continue;const id=comps.length+1;let x0=1e9,y0=1e9,x1=-1,y1=-1,n=0;st.push(i);lab[i]=id;
      while(st.length){const j=st.pop();const x=j%W,y=(j/W)|0;n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
        for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;const k=yy*W+xx;if(m[k]&&!lab[k]){lab[k]=id;st.push(k)}}}
      comps.push({id,x0,y0,x1,y1,w:x1-x0+1,h:y1-y0+1,n})}
    return comps.filter(c=>c.n>=4);
  }
  function lit(M,x0,y0,x1,y1){x0=Math.max(0,Math.round(x0));y0=Math.max(0,Math.round(y0));x1=Math.min(M.W-1,Math.round(x1));y1=Math.min(M.H-1,Math.round(y1));let n=0,t=0;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){t++;if(M.m[y*M.W+x])n++}return t?n/t:0}
  function findRow(comps,H){
    // filas: grupos de piezas solapadas en vertical; nos quedamos con la de dígitos más grandes y numerosos
    const big=comps.filter(c=>c.h>=H*0.03);let best=null;
    big.forEach(c=>{const top=c.y0,bot=c.y1;const mem=comps.filter(o=>{const cy=(o.y0+o.y1)/2;return cy>=top-(bot-top)*.1&&cy<=bot+(bot-top)*.1});
      const tall=mem.filter(o=>o.h>=c.h*.7&&o.h<=c.h*1.3&&o.w<=c.h*1.2);const xs=new Set(tall.map(o=>Math.round(o.x0/(c.h*.4))));
      const score=xs.size*c.h;if(tall.length>=3&&(!best||score>best.score))best={score,top,bot,h:c.h}});
    return best;
  }
  function rotated(cv,deg){if(!deg)return cv;const c=document.createElement("canvas");c.width=cv.width;c.height=cv.height;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(cv,-cv.width/2,-cv.height/2);return c}
  function read(src,opt){
    opt=opt||{};const base=toCanvas(src,opt.crop,opt.maxW||1100);let best=null;
    const score=r=>(r.time!=null?2:0)+(r.weight!=null?2:0)+(r.fields.length?1:0)-(r.fields.join("").includes("?")?1:0);
    outer:for(const dil of [0,3,6])for(const deg of [0,-4,4,-8,8]){let r=readOne(rotated(base,deg),opt,dil);
      // endereza la foto según la inclinación de la fila y vuelve a leer
      if(r.slope!=null&&Math.abs(r.slope)>.012){const r2=readOne(rotated(base,deg-Math.atan(r.slope)*180/Math.PI),opt,dil);if(score(r2)>=score(r))r=r2}
      const sc=score(r);if(!best||sc>best.sc)best={sc,r};if(sc>=4)break outer}
    return best.r;
  }
  function dilate(M,r){if(!r)return M;const {W,H}=M;const a=new Uint8Array(W*H),b=new Uint8Array(W*H);
    for(let y=0;y<H;y++){let run=-1e9;for(let x=0;x<W;x++){if(M.m[y*W+x])run=x;if(x-run<=r)a[y*W+x]=1}run=1e9;for(let x=W-1;x>=0;x--){if(M.m[y*W+x])run=x;if(run-x<=r)a[y*W+x]=1}}
    for(let x=0;x<W;x++){let run=-1e9;for(let y=0;y<H;y++){if(a[y*W+x])run=y;if(y-run<=r)b[y*W+x]=1}run=1e9;for(let y=H-1;y>=0;y--){if(a[y*W+x])run=y;if(run-y<=r)b[y*W+x]=1}}
    return{m:b,W,H}}
  function readOne(cv,opt,dil){const M=dilate(mask(cv),dil);const comps=components(M);
    const row=findRow(comps,M.H);if(!row)return{fields:[],time:null,weight:null,error:"No encuentro los números de la báscula"};
    const RH=row.bot-row.top+1;
    // línea de base de la fila (la foto puede estar algo inclinada)
    const cyOf=c=>(c.y0+c.y1)/2,cxOf=c=>(c.x0+c.x1)/2;
    const fit=pts=>{const n=pts.length;if(n<2)return{a:0,b:pts.length?cyOf(pts[0]):(row.top+row.bot)/2};let sx=0,sy=0,sxx=0,sxy=0;pts.forEach(c=>{const x=cxOf(c),y=cyOf(c);sx+=x;sy+=y;sxx+=x*x;sxy+=x*y});const d=n*sxx-sx*sx;const a=d?(n*sxy-sx*sy)/d:0;return{a:Math.max(-.2,Math.min(.2,a)),b:(sy-a*sx)/n}};
    const isTall=c=>c.h>=row.h*.6&&c.h<=row.h*1.35&&c.w<=row.h*2.2;
    let tall=comps.filter(c=>isTall(c)&&Math.min(c.y1,row.bot)-Math.max(c.y0,row.top)>=c.h*.3);let L=fit(tall);
    for(let it=0;it<2;it++){tall=comps.filter(c=>isTall(c)&&Math.abs(cyOf(c)-(L.a*cxOf(c)+L.b))<RH*.35);L=fit(tall)}
    const yAt=x=>L.a*x+L.b;
    const inRow=comps.filter(c=>Math.abs(cyOf(c)-yAt(cxOf(c)))<RH*.75&&c.h<=RH*1.35);
    const small=inRow.filter(c=>c.h<RH*.3&&c.w<RH*.3);const parts=inRow.filter(c=>!small.includes(c)).sort((a,b)=>a.x0-b.x0);
    // une piezas del mismo dígito (solapan en horizontal)
    let digits=[];parts.forEach(p=>{const d=digits.find(q=>Math.min(q.x1,p.x1)-Math.max(q.x0,p.x0)>Math.min(q.w,p.w)*.4);
      if(d){d.x0=Math.min(d.x0,p.x0);d.x1=Math.max(d.x1,p.x1);d.y0=Math.min(d.y0,p.y0);d.y1=Math.max(d.y1,p.y1);d.w=d.x1-d.x0+1;d.h=d.y1-d.y0+1}else digits.push(Object.assign({},p))});
    digits=digits.filter(d=>d.h>=RH*.55);
    // ancho típico de un dígito y separación de bloques pegados (p. ej. "0:2" unidos por los dos puntos)
    const ws=digits.filter(d=>d.w>=RH*.35&&d.w<=RH*.9).map(d=>d.w).sort((a,b)=>a-b);const Wd=ws.length?ws[ws.length>>1]:RH*.6;
    const extra=[];
    digits=digits.flatMap(d=>{if(d.w<=Wd*1.45)return[d];const k=Math.max(2,Math.round(d.w/(Wd*1.15)));const out=[];
      const L0=Object.assign({},d,{x1:d.x0+Wd-1,w:Wd});const R0=Object.assign({},d,{x0:d.x1-Wd+1,w:Wd});out.push(L0);
      if(k>=3){for(let q=1;q<k-1;q++){const x0=Math.round(d.x0+q*(d.w-Wd)/(k-1));out.push(Object.assign({},d,{x0,x1:x0+Wd-1,w:Wd}))}}
      out.push(R0);
      const gx0=L0.x1+1,gx1=R0.x0-1;if(k===2&&gx1-gx0>=Wd*.12){const yc=yAt((gx0+gx1)/2);const up=lit(M,gx0,yc-RH*.35,gx1,yc-RH*.1),dn=lit(M,gx0,yc+RH*.1,gx1,yc+RH*.35),bot=lit(M,gx0,yc+RH*.35,gx1,yc+RH*.5);
        if(up>.12&&dn>.12)extra.push({x:gx0,x1:gx1,ch:":"});else if(bot>.12)extra.push({x:gx0,x1:gx1,ch:"."})}
      return out});
    const chars=extra.slice();
    const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[a.length>>1]:null};
    const fulls=digits.filter(d=>d.h>=RH*.85);const oT=med(fulls.map(d=>d.y0-yAt(cxOf(d)))),oB=med(fulls.map(d=>d.y1-yAt(cxOf(d))));
    digits.forEach(d=>{
      const yc=yAt(cxOf(d));const full=d.h>=RH*.85;const y0=full?d.y0:yc+(oT!=null?oT:-RH/2),y1=full?d.y1:yc+(oB!=null?oB:RH/2),h=y1-y0+1;let ch,bits;
      if(d.w<h*.38)ch="1";else{const x0=d.x0,w=d.w;const Z=(a,b,c,e)=>lit(M,x0+a*w,y0+c*h,x0+b*w,y0+e*h);
        const s=[Z(.28,.72,0,.14),Z(.72,1,.16,.42),Z(.72,1,.58,.84),Z(.28,.72,.86,1),Z(0,.28,.58,.84),Z(0,.28,.16,.42),Z(.28,.72,.43,.57)];
        const thr=Math.max(.18,Math.max(...s)*.38);bits=s.map(v=>v>=thr?"1":"0").join("");ch=decode(bits);bits+=" "+s.map(v=>v.toFixed(2)).join(",")}
      chars.push({x:d.x0,x1:d.x1,ch,bits})});
    small.forEach(sm=>{const cy=cyOf(sm),yc=yAt(cxOf(sm));chars.push({x:sm.x0,x1:sm.x1,ch:cy>yc+RH*.22?".":":",y:cy})});
    chars.sort((a,b)=>a.x-b.x);
    // dos puntos: dos piezas pequeñas una encima de otra
    const out=[];chars.forEach(c=>{const prev=out[out.length-1];if(c.ch===":"&&prev&&prev.ch===":"&&Math.abs(prev.x-c.x)<RH*.3)return;out.push(c)});
    const digW=chars.filter(c=>/\d/.test(c.ch)).map(c=>c.x1-c.x).sort((a,b)=>a-b)[0]||RH*.5;
    const fields=[];let cur=null;out.forEach((c,i)=>{const gap=cur?c.x-cur.last:0;if(!cur||gap>Math.max(RH*.75,digW*1.1)){cur={s:"",last:c.x1};fields.push(cur)}cur.s+=c.ch;cur.last=c.x1});
    const fs=fields.map(f=>f.s.replace(/^[.:]+|[.:]+$/g,"")).filter(Boolean);
    const tf=fs.find(f=>/^\d{1,2}:\d{2}$/.test(f))||null;
    let time=null;if(tf){const[a,b]=tf.split(":");time=(+a)*60+(+b)}
    const wf=fs.length>=2?fs[fs.length-1]:null;const weight=wf&&/^\d+(\.\d)?$/.test(wf)?parseFloat(wf):null;
    return{fields:fs,time,weight,timeText:tf,weightText:wf,slope:L.a,debug:opt.debug?{W:M.W,H:M.H,row,line:L,Wd,digits:digits.map(d=>[d.x0,d.y0,d.w,d.h]),small:small.map(d=>[d.x0,d.y0,d.w,d.h]),chars:out.map(c=>c.ch+"@"+c.x+(c.bits?"/"+c.bits:""))}:undefined};
  }
  return{read};
})();

const METHODS=["V60","Espresso","AeroPress","Otro"];
const ROASTS=["Claro","Medio","Oscuro"];
const TASTE=[["acid","Acidez","apagada","intensa"],["sweet","Dulzor","nada","mucho"],["bitter","Amargor","nada","mucho"],["body","Cuerpo","ligero","denso"]];
/* sensaciones en taza: inicio, final y notas captadas */
const SENS=[
 ["start","Inicio",["Agradable","Ácido / agrio","Plano"]],
 ["finish","Final",["Limpio / dulce","Amargo","Astringente","Corto / aguado"]],
 ["caught","Notas captadas",["Sí, claras","Algo","No"]],
];
/* extracción: depende del método */
const EXTR=m=>{
  const ch=["channel","Canalización",["No","Leve","Clara"]];
  if(m==="Espresso")return[ch,["flow","Flujo",["Uniforme","Rápido","Lento","Irregular"]],["puck","Pastilla",["Firme y seca","Encharcada","Con agujeros"]]];
  if(m==="V60")return[["flow","Drenaje",["Normal","Rápido","Lento / atascado"]],["bed","Lecho final",["Plano","Irregular / cráter","Café en paredes"]]];
  if(m==="AeroPress")return[["flow","Prensado",["Normal","Muy fácil","Muy duro"]]];
  return[["flow","Flujo",["Normal","Rápido","Lento"]]];
};
const XKEYS=["start","finish","caught","channel","flow","puck","bed"];
const LS_KEY="bitacora-cafe-v1";
const DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
const fmtTime=s=>{if(s==null)return"–";s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const parseTime=t=>{if(t==null||t==="")return null;t=String(t).trim();if(t.includes(":")){const[m,s]=t.split(":");const mm=num(m),ss=num(s);return mm==null?null:mm*60+(ss||0)}return num(t)};
const r1=v=>Math.round(v*10)/10;
const scoreColor=s=>s>=9?"var(--s-top)":s>=7?"var(--s-good)":s>=5?"var(--s-mid)":"var(--s-low)";
const fmtDate=ts=>{const d=new Date(ts);return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})};
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isoMinusDays=(ts,d)=>{const x=new Date(ts-d*DAY);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};

/* MiCoffee DF54: dial continuo 0–90, número menor = más fino */

/* ---------- frescura ---------- */
function freshness(age,roast,method){
  if(age==null)return null;
  const esp=method==="Espresso";const G=n=>"En el DF54, "+df54(n,method);
  let f;
  if(esp){
    if(age<7)f={tag:"Recién tostado",color:"var(--s-mid)",adj:{grind:+1},tips:["Con tan poco reposo el CO₂ hace la crema inestable y el shot sale ácido o con canalizaciones.",G(1)+" o, mejor, espera a que tenga 7–10 días."]};
    else if(age<=30)f={tag:"En su punto",color:"var(--s-top)",adj:{},tips:["Ventana óptima para espresso. No hace falta compensar."]};
    else if(age<=50)f={tag:"Empieza a perder aroma",color:"var(--s-good)",adj:{grind:-1},tips:["El café fluye más rápido. "+G(-1)+" para mantener el tiempo hasta parar."]};
    else f={tag:"Café antiguo",color:"var(--s-low)",adj:{grind:-2,ratio:-.2},tips:[G(-2)+" para frenar el caudal.","Ratio algo más corto para ganar cuerpo y sabor."]};
    f.tips.push("En espresso la compensación se hace con molienda y ratio.");
    return f;
  }
  if(age<4)f={tag:"Recién tostado",color:"var(--s-mid)",adj:{bloom:+15,bloomMult:3},
    tips:["Desgasifica mucho: alarga el bloom y usa algo más de agua en él (×3 la dosis).","Lo ideal es dejarlo reposar hasta el día 5–7."]};
  else if(age<=21)f={tag:"En su punto",color:"var(--s-top)",adj:{},tips:["Ventana óptima de frescura. No hace falta compensar."]};
  else if(age<=45)f={tag:"Empieza a perder aroma",color:"var(--s-good)",adj:{temp:+1,grind:-1,bloom:-10},
    tips:["Sube 1 °C. "+G(-1)+" para extraer lo que queda de dulzor.","El bloom puede ser más corto: apenas hay CO₂."]};
  else f={tag:"Café antiguo",color:"var(--s-low)",adj:{temp:+2,grind:-2,bloom:-15,ratio:-.5},
    tips:["Sube 2 °C. "+G(-2)+".","Ratio algo más corto (menos agua por gramo) para compensar la pérdida de sabor.","Bloom corto: unos 30 s bastan."]};
  if(roast==="Oscuro")f.tips.push("Al ser tueste oscuro, no pases de 92 °C aunque subas la temperatura.");
  if(roast==="Claro")f.tips.push("Al ser tueste claro, quédate por encima de 92 °C.");
  f.cap=roast==="Oscuro"?92:null;f.floor=roast==="Claro"?92:null;
  return f;
}

    const rows=[{t:0,g:bG}];const rest=water-bG,per=Math.round(rest/n);for(let k=0;k<n;k++)rows.push({t:bloom+k*35,g:k<n-1?per:rest-per*(n-1)});
    out.push({id:"demo"+i,demo:true,ts,method:"V60",coffee,roast:"Claro",roastDate:isoMinusDays(ts,age),dose,water,grind,temp,time,bloom,pours:rows,score:clamp(Math.round(s),1,10),

  }
  for(let i=0;i<6;i++){
    const ts=now-(6-i)*DAY*2.1-5*3600000;const ratio=1.8+rnd()*.8,temp=null,time=24+Math.round(rnd()*10),grind=15+Math.round(rnd()*6);
    const s=8.4-6*(ratio-2.2)**2-.04*(time-28)**2-.15*(grind-18)**2+(rnd()-.5);

async function sync(){
  if(!CLIENT_ID){setDrive("noconfig");return}

    let remote={brews:[],deleted:{}};
    if(drive.fileId){
      try{remote=await (await api(`https://www.googleapis.com/drive/v3/files/${drive.fileId}?alt=media`)).json()}
      catch(e){if(e.code==="http"&&e.status===404){drive.fileId=await findFile();if(drive.fileId)remote=await (await api(`https://www.googleapis.com/drive/v3/files/${drive.fileId}?alt=media`)).json()}else throw e}
    }
    if(!remote||!Array.isArray(remote.brews))remote={brews:[],deleted:{}};
    const local={brews:store.real,deleted:store.deleted};
    const merged=mergeData(local,remote);
    const body=JSON.stringify({app:"Bitácora de Café",formato:2,actualizado:new Date().toISOString(),brews:merged.brews,deleted:merged.deleted});
    if(!drive.fileId){
      const b="bc"+Date.now().toString(36);

      const j=await (await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp})).json();
      drive.fileId=j.id;
    }else if(sig(merged)!==sig(remote)){
      await api(`https://www.googleapis.com/upload/drive/v3/files/${drive.fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json; charset=UTF-8"},body});
    }

    drive.last=Date.now();dsave({fileId:drive.fileId,last:drive.last});setDrive("ok");
    if(changed&&ui.tab!=="new")render();

    if(e&&e.code==="auth")setDrive("expired");else setDrive(navigator.onLine===false?"offline":"error");

}

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;text=text.replace(/^\ufeff/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x!==""));
}

  if(!s)return null;const parts=s.split("→").map(x=>x.trim());const out=[];
  for(const p of parts){let m=p.match(/^Bloom\s+([\d.,]+)\s*g/i);if(m){out.push({t:0,g:num(m[1])});continue}
    m=p.match(/^(\d+:\d{2})\s+([\d.,]+)\s*g/);if(m)out.push({t:parseTime(m[1]),g:num(m[2])});else return null}
  return out.length>1?out:null;
}

/* gráfico escalonado de vertidos */
function pourChart(pours,T,opts){
  opts=opts||{};const W=340,H=opts.h||130,L=34,R=10,Tp=10,B=22;
  const tot=pours.reduce((a,p)=>a+(p.g||0),0)||1;
  const last=pours[pours.length-1].t||0;const tMax=Math.max(T||0,last+45,60);
  const sx=t=>L+t/tMax*(W-L-R),sy=g=>Tp+(1-g/tot)*(H-Tp-B);
  let d=`M${sx(0)} ${sy(0)}`,cum=0,marks="";
  pours.forEach((p,i)=>{
    const next=i<pours.length-1?pours[i+1].t:null;
    const dur=Math.max(4,Math.min(next!=null?(next-p.t)*.6:20,Math.max(6,(p.g||0)/6)));
    d+=` L${sx(p.t).toFixed(1)} ${sy(cum).toFixed(1)}`;cum+=p.g||0;d+=` L${sx(p.t+dur).toFixed(1)} ${sy(cum).toFixed(1)}`;
    marks+=`<circle cx="${sx(p.t).toFixed(1)}" cy="${sy(cum-(p.g||0)).toFixed(1)}" r="3.5" fill="${i===0?"var(--accent)":"var(--water)"}"/>`;
    if(!opts.mini)marks+=`<text x="${sx(p.t).toFixed(1)}" y="${H-8}" text-anchor="middle">${fmtTime(p.t)}</text>`;
  });
  d+=` L${sx(tMax).toFixed(1)} ${sy(cum).toFixed(1)}`;
  const area=d+` L${sx(tMax).toFixed(1)} ${sy(0)} Z`;
  let grid="";[0,.5,1].forEach(f=>{const g=Math.round(tot*f);grid+=`<line x1="${L}" x2="${W-R}" y1="${sy(g)}" y2="${sy(g)}" stroke="var(--line)"/><text x="${L-5}" y="${sy(g)+3}" text-anchor="end">${g}</text>`});
  const end=T?`<line x1="${sx(T)}" x2="${sx(T)}" y1="${Tp}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${sx(T)-3}" y="${Tp+8}" text-anchor="end">fin ${fmtTime(T)}</text>`:"";
  return `<svg class="pchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Agua acumulada por vertido">${grid}<path d="${area}" fill="var(--water)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--water)" stroke-width="2" stroke-linejoin="round"/>${end}${marks}</svg>`;
}

/* ---------- análisis ---------- */
function pearson(xs,ys){const n=xs.length;if(n<3)return 0;const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2;syy+=(ys[i]-my)**2}return sxx&&syy?sxy/Math.sqrt(sxx*syy):0}
function quadFit(xs,ys){
  const n=xs.length;const m=xs.reduce((a,b)=>a+b)/n;const X=xs.map(x=>x-m);
  let S=[0,0,0,0,0],T=[0,0,0];
  for(let i=0;i<n;i++){let p=1;for(let k=0;k<5;k++){S[k]+=p;p*=X[i]}T[0]+=ys[i];T[1]+=ys[i]*X[i];T[2]+=ys[i]*X[i]*X[i]}
  const A=[[S[0],S[1],S[2],T[0]],[S[1],S[2],S[3],T[1]],[S[2],S[3],S[4],T[2]]];
  for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];if(Math.abs(A[c][c])<1e-9)return null;for(let r=0;r<3;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let k=c;k<4;k++)A[r][k]-=f*A[c][k]}}
  const c0=A[0][3]/A[0][0],c1=A[1][3]/A[1][1],c2=A[2][3]/A[2][2];
  return{a:c2,f:x=>c0+c1*(x-m)+c2*(x-m)**2,vertex:c2<0?m-c1/(2*c2):null};
}
function analyze(list){
  const out={n:list.length,params:{},infl:[]};
  const smax=Math.max(...list.map(b=>b.score));
  PARAMS.forEach(p=>{
    const pts=list.map(b=>({x:p.get(b),y:b.score})).filter(o=>o.x!=null&&o.y!=null);
    if(pts.length<2){out.params[p.k]=null;return}
    const xs=pts.map(o=>o.x),ys=pts.map(o=>o.y);
    const min=Math.min(...xs),max=Math.max(...xs),range=max-min;
    let ws=0,wx=0;pts.forEach(o=>{const w=Math.exp((o.y-smax)/1.2);ws+=w;wx+=w*o.x});
    let est=wx/ws,how="media de tus mejores tazas",fit=null;
    const distinct=new Set(xs.map(x=>r1(x))).size;
    if(pts.length>=6&&distinct>=3&&range>0){fit=quadFit(xs,ys);if(fit&&fit.vertex!=null&&fit.vertex>=min-range*.1&&fit.vertex<=max+range*.1){est=(fit.vertex+est)/2;how="curva de tus valoraciones"}else fit=fit&&fit.a<0?fit:null}
    const good=pts.filter(o=>o.y>=smax-1).map(o=>o.x);
    const conf=pts.length>=12&&range>0?3:pts.length>=5&&range>0?2:1;
    out.params[p.k]={est,how,lo:Math.min(...good),hi:Math.max(...good),n:pts.length,conf,pts,fit,min,max,smax};
    if(pts.length>=5&&range>0)out.infl.push({p,r:pearson(xs,ys)});
  });
  out.infl.sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  out.best=list.slice().sort((a,b)=>b.score-a.score||b.ts-a.ts)[0];
  return out;
}
/* receta sugerida, con ajuste por frescura opcional */
function suggestion(method,list,fr){
  const an=analyze(list);const P=an.params;const rec={};
  PARAMS.forEach(p=>{if(!p.info&&P[p.k])rec[p.k]=P[p.k].est});
  if(method!=="V60"){delete rec.pours;delete rec.bloomMult}
  const notes={};
  if(fr){const a=fr.adj;
    if(a.temp&&rec.temp!=null){rec.temp+=a.temp;notes.temp=(a.temp>0?"+":"")+a.temp+" °C por frescura"}
    if(a.grind&&rec.grind!=null){rec.grind+=a.grind*gstep(method);notes.grind=df54(a.grind,method)+" por frescura"}
    if(a.bloom&&rec.bloom!=null){rec.bloom=Math.max(20,rec.bloom+a.bloom);notes.bloom=(a.bloom>0?"+":"")+a.bloom+" s por frescura"}
    if(a.bloomMult&&method==="V60"){rec.bloomMult=Math.max(rec.bloomMult||0,a.bloomMult);notes.bloomMult="más agua por frescura"}
    if(a.ratio&&rec.ratio!=null){rec.ratio+=a.ratio;notes.ratio="más corto por frescura"}
    if(rec.temp!=null){if(fr.cap&&rec.temp>fr.cap){rec.temp=fr.cap;notes.temp="máx. 92 °C en tueste oscuro"}if(fr.floor&&rec.temp<fr.floor){rec.temp=fr.floor;notes.temp="mín. 92 °C en tueste claro"}}
  }
  return{an,rec,notes};
}
/* lee las notas de cata en texto libre (para registros antiguos o cuando no se marcan los chips) */
function parseNotes(txt){
  const o={};if(!txt)return o;
  const s=" "+String(txt).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")+" ";
  const neg=w=>new RegExp("(sin|no|nada|ni)\\s+(\\w+\\s+){0,3}"+w).test(s);
  // canalización
  if(/canaliz|channel/.test(s))o.channel=neg("(canaliz|channel)")?"No":/(leve|poca|algo|ligera|un poco)\s+(\w+\s+){0,2}(canaliz|channel)|(canaliz|channel)\w*\s+(leve|ligera)/.test(s)?"Leve":"Clara";
  // final
  const fin=s.match(/(final|retrogusto|postgusto|regusto|al terminar|termina)[^.;\n]{0,40}/g)||[];
  const finTxt=fin.join(" ");
  if(/amarg/.test(finTxt)&&!/(sin|no|nada)\s+(\w+\s+){0,2}amarg/.test(finTxt))o.finish="Amargo";
  else if(/astring|seco|reseca|aspero/.test(finTxt))o.finish="Astringente";
  else if(/corto|aguado|acuoso|se va|desaparece/.test(finTxt))o.finish="Corto / aguado";
  else if(/limpio|dulce|agradable|largo|bueno|bien|redondo/.test(finTxt))o.finish="Limpio / dulce";
  else if(/amarg/.test(s)&&!neg("amarg"))o.finish="Amargo";
  else if(/astring/.test(s)&&!neg("astring"))o.finish="Astringente";
  // inicio
  const ini=(s.match(/(inicio|entrada|ataque|al principio|primer sorbo|empieza)[^.;\n]{0,40}/g)||[]).join(" ");
  if(ini){
    if(/agri|acid|punzante|salad/.test(ini)&&!/(sin|no)\s+(\w+\s+){0,2}(agri|acid)/.test(ini))o.start="Ácido / agrio";
    else if(/plano|apagado|soso|sin sabor|flojo/.test(ini))o.start="Plano";
    else if(/agradable|bueno|bien|dulce|brillante|jugoso|rico|limpio/.test(ini))o.start="Agradable";
  }else if(/agrio|salado/.test(s)&&!neg("(agrio|salado)"))o.start="Ácido / agrio";
  // notas captadas
  if(/(no|sin|ningun\w*)\s+(\w+\s+){0,3}notas|no (he )?(capt|sent|not|detect)/.test(s))o.caught="No";
  else if(/(algo|poco|ligera\w*|leve\w*|tenue\w*)\s+(\w+\s+){0,2}(notas|a )|apenas/.test(s)&&/notas/.test(s))o.caught="Algo";
  else if(/notas? (a|de)\s+\w|melocot|chocolat|cacao|caramel|frut|citric|floral|jazmin|bergamot|fresa|cereza|nuez|avellan|miel|panela|limon|naranja|mora|arandan|vino|ciruela|manzana|pera|uva|te negro|vainilla|almendra|tofe|toffee/.test(s))o.caught="Sí, claras";
  return o;
}
/* valor efectivo: el chip marcado manda; si no, lo leído en las notas */
function sens(b){
  const p=parseNotes(b.notes);const o={},from={};
  if(b.method!=="Espresso"){delete p.channel;delete p.puck}
  XKEYS.forEach(k=>{if(k==="channel"&&b.method!=="Espresso")return;if(b[k]){o[k]=b[k];from[k]="chip"}else if(p[k]){o[k]=p[k];from[k]="notas"}});
  return{v:o,from};
}
function diagnose(b){
  const t=[];if(!b)return t;
  const a=b.acid,s=b.sweet,bi=b.bitter,bo=b.body;const esp=b.method==="Espresso",v60=b.method==="V60";
  const fine="En el DF54, "+df54(-1,b.method),coarse="En el DF54, "+df54(1,b.method);
  const {v,from}=sens(b);const tag=k=>from[k]==="notas"?" <span class=\"src\">(leído de tus notas)</span>":"";
  const ch=v.channel==="Clara"||v.channel==="Leve"||v.puck==="Con agujeros"||v.bed==="Irregular / cráter"||v.flow==="Irregular";
  const bitterFin=v.finish==="Amargo",sourStart=v.start==="Ácido / agrio";
  const strong=v.channel==="Clara"||v.puck==="Con agujeros"||(ch&&sourStart&&bitterFin);

    const why=v.channel?(v.channel==="Leve"?"Canalización leve":"Canalización clara")+tag("channel"):v.puck==="Con agujeros"?"Pastilla con agujeros"+tag("puck"):v.bed?"Lecho irregular"+tag("bed"):"Flujo irregular"+tag("flow");
    t.push(why+": el agua ha pasado por caminos preferentes, así que parte del café se sobreextrae y otra queda cruda."+(strong&&(sourStart||bitterFin||v.finish==="Astringente")?" "+(sourStart&&bitterFin?"Por eso notas a la vez inicio ácido y final amargo.":"Lo más probable es que el "+(bitterFin?"final amargo":v.finish==="Astringente"?"final astringente":"inicio ácido")+" venga de ahí, así que no cambies la molienda por eso todavía."):"")+" "+(esp?"Antes de tocar la molienda, revisa la preparación: rompe grumos (WDT), distribuye bien y tampa nivelado. Si además fluyó rápido, "+df54(-1,b.method)+".":v60?"Remueve bien el bloom para mojar todo el café, vierte suave en el centro sin tocar las paredes y da un giro suave al final para dejar el lecho plano.":"Remueve bien al principio para mojar todo el café y prensa de forma lenta y constante.")+(v.channel==="Clara"?" Esta taza no cuenta para la receta sugerida.":""));
  }
  // 2. flujo / pastilla / drenaje
  if(esp&&v.flow==="Rápido")t.push("Flujo rápido"+tag("flow")+": "+fine+" o sube un poco la dosis.");
  if(esp&&v.flow==="Lento")t.push("Flujo lento"+tag("flow")+": "+coarse+".");
  if(esp&&v.puck==="Encharcada")t.push("Pastilla encharcada"+tag("puck")+": suele indicar poca dosis para el cestillo (queda mucho espacio arriba). Prueba +0,5–1 g o "+df54(-1,b.method)+".");
  if(v60&&v.flow==="Lento / atascado")t.push("Drenaje lento"+tag("flow")+": demasiados finos o molienda fina. "+coarse+" y agita menos en los vertidos.");
  if(v60&&v.flow==="Rápido")t.push("Drenaje rápido"+tag("flow")+": "+fine+" o vierte más despacio para alargar el contacto.");
  if(v60&&v.bed==="Café en paredes")t.push("Café pegado en las paredes"+tag("bed")+": esos granos apenas se extraen. Vierte más al centro y da un giro suave al final.");
  if(b.method==="AeroPress"&&v.flow==="Muy duro")t.push("Prensado muy duro"+tag("flow")+": "+coarse+".");
  if(b.method==="AeroPress"&&v.flow==="Muy fácil")t.push("Prensado muy fácil"+tag("flow")+": "+fine+".");
  // 3. sabor: escalas + inicio/final
  if(!strong){
    if(bitterFin||(bi!=null&&bi>=4)){over=true;
      t.push((bitterFin?"Final amargo"+tag("finish"):"Amargor marcado")+(bitterFin&&bi!=null&&bi>=4?" y amargor alto":"")+": probable sobreextracción. "+(esp?coarse+" o para la máquina antes (ratio más corto).":coarse+", baja la temperatura 1–2 °C o acorta el tiempo."))}
    if(!over&&(sourStart||(a!=null&&bi!=null&&a>=4&&bi<=2))){under=true;
      t.push((sourStart?"Inicio ácido o agrio"+tag("start"):"Acidez alta y poco amargor")+": suele ser subextracción. "+(esp?fine+" o alarga el ratio (más bebida en taza).":fine+" o sube la temperatura 1–2 °C."))}
  }

  if(v.finish==="Corto / aguado"&&!under)t.push("Final corto o aguado"+tag("finish")+": falta extracción o concentración. "+(esp?fine+" o ratio más corto.":"Ratio más corto (menos agua por gramo) o "+df54(-1,b.method)+"."));
  if(bo!=null&&bo<=2&&v.finish!=="Corto / aguado")t.push("Poco cuerpo: sube la dosis o usa un ratio más corto (menos agua por gramo).");
  if(bo!=null&&bo>=5&&!esp)t.push("Cuerpo muy denso: un ratio algo más largo puede dar más claridad.");
  if(s!=null&&s<=2&&!t.length)t.push("Falta dulzor sin defectos claros: mueve el DF54 de "+(esp?"medio en medio número":gstep(b.method)+" en "+gstep(b.method)+" números")+" hasta encontrar el punto dulce.");
  if(v.caught==="No"&&!t.length)t.push("No captaste notas"+tag("caught")+" y no hay un defecto claro: suele faltar algo de extracción. "+(esp?fine+".":"Prueba "+df54(-1,b.method)+" o +1 °C.")+" Si el café tiene más de un mes, puede ser que haya perdido aroma.");
  if(v.finish==="Limpio / dulce"&&v.caught==="Sí, claras"&&!t.length)t.push("Final limpio y notas claras: la receta está en su punto. Repítela y cambia una sola variable cada vez si quieres afinar.");
  const anyData=[a,s,bi,bo].some(x=>x!=null)||Object.keys(v).length;
  if(!t.length&&b.score>=8)t.push("Taza equilibrada. Repite la receta y cambia una sola variable cada vez para afinar.");
  if(!t.length&&anyData)t.push("Sin defectos claros en esta taza (nota "+b.score+"). Para subir la nota, cambia una sola variable: "+(esp?"medio número de molienda o 2 g de bebida en taza.":"un paso de molienda o 1 °C de temperatura.")+" Si tienes dudas sobre el final o el inicio, márcalo en Sensaciones y el diagnóstico será más concreto.");
  if(!t.length)t.push("Esta taza no tiene acidez, dulzor, amargor ni sensaciones registradas. Márcalas al registrar para obtener un diagnóstico.");
  return t;
}
/* patrones en las últimas tazas de un método */
function patterns(list){
  const last=list.slice(0,10);if(last.length<3)return[];
  const S=last.map(b=>({b,v:sens(b).v}));const out=[];const n=last.length;const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const cnt=f=>S.filter(f).length;
  const bit=cnt(o=>o.v.finish==="Amargo");if(bit>=2)out.push("Final amargo en "+bit+" de tus últimas "+n+" tazas. Tu molienda de base tiende a quedarse fina para este café: prueba la receta sugerida un paso más gruesa.");
  const sour=cnt(o=>o.v.start==="Ácido / agrio");if(sour>=2)out.push("Inicio ácido o agrio en "+sour+" de "+n+". Tiende a faltar extracción: un paso más fino o, en filtro, +1 °C.");
  const ast=cnt(o=>o.v.finish==="Astringente");if(ast>=2)out.push("Final astringente en "+ast+" de "+n+". Revisa la agitación y la distribución antes que la receta.");
  const chY=S.filter(o=>o.v.channel==="Leve"||o.v.channel==="Clara"),chN=S.filter(o=>o.v.channel==="No");
  if(chY.length>=2)out.push("Canalización en "+chY.length+" de "+n+(chN.length?" · nota media "+r1(avg(chY.map(o=>o.b.score)))+" con canalización frente a "+r1(avg(chN.map(o=>o.b.score)))+" sin ella":"")+". Mejorar la preparación del café es ahora lo que más te subiría la nota.");
  const cY=S.filter(o=>o.v.caught==="Sí, claras"),cN=S.filter(o=>o.v.caught==="No");
  if(cY.length&&cN.length)out.push("Captas notas claras en "+cY.length+" de "+n+" tazas (nota media "+r1(avg(cY.map(o=>o.b.score)))+"). Compara su receta con la de las tazas sin notas ("+r1(avg(cN.map(o=>o.b.score)))+").");
  return out;
}

async function openCam(){
  const m=ui.form.method;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ui.scan={method:m,status:"nocam"};render();return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}})}
  catch(err){ui.scan={method:m,status:"nocam"};render();return}
  cam.stream=stream;const el=document.createElement("div");el.className="camov";el.setAttribute("role","dialog");el.setAttribute("aria-label","Cámara");
  el.innerHTML=`<video autoplay playsinline muted></video><div class="camguide"><span>Encuadra la pantalla de la báscula</span></div><div class="cambar"><button class="btn ghost" data-cam="x">Cancelar</button><button class="btn primary" data-cam="shot">Leer</button></div>`;
  document.body.appendChild(el);cam.el=el;const v=el.querySelector("video");v.srcObject=stream;
  el.addEventListener("click",async e=>{const b=e.target.closest("[data-cam]");if(!b)return;
    if(b.dataset.cam==="x"){closeCam();return}
    if(!v.videoWidth)return;const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
    closeCam();ui.scan={method:m,status:"reading"};render();
    await new Promise(r=>setTimeout(r,30));
    let r={time:null,weight:null};try{r=ScaleOCR.read(c)}catch(err){}
    // miniatura solo en memoria: desaparece con el panel y nunca se guarda
    let img=null;try{const k=Math.min(1,360/c.width);const t=document.createElement("canvas");t.width=Math.round(c.width*k);t.height=Math.round(c.height*k);t.getContext("2d").drawImage(c,0,0,t.width,t.height);img=t.toDataURL("image/jpeg",.7);t.width=t.height=0}catch(err){}
    c.width=c.height=0; // libera la imagen grande
    ui.scan={method:m,status:"done",time:r.time,weight:r.weight,img};render()});
}

function confDots(c){return `<span class="conf" title="Confianza">${[1,2,3].map(i=>`<i class="${i<=c?"on":""}"></i>`).join("")}</span>`}
function chartSVG(pa,p){
  const W=340,H=210,L=34,R=12,T=12,B=30;
  let x0=pa.min,x1=pa.max;if(x1===x0){x0-=1;x1+=1}const pad=(x1-x0)*.08;x0-=pad;x1+=pad;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(10-y)/9*(H-T-B);
  const step=(()=>{const raw=(x1-x0)/4,m=10**Math.floor(Math.log10(raw)),n=raw/m;return(n<1.5?1:n<3?2:n<7?5:10)*m})();
  const tick=x=>p.k==="time"?fmtTime(x):p.k==="ratio"||p.k==="bloomMult"?x.toFixed(step<1?1:0):String(r1(x));
  let g="";for(let y=1;y<=10;y+=3){g+=`<line x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${sy(y)+3}" text-anchor="end">${y}</text>`}
  for(let x=Math.ceil(x0/step)*step;x<=x1+1e-9;x+=step){g+=`<text x="${sx(x)}" y="${H-12}" text-anchor="middle">${tick(x)}</text>`}
  let curve="";if(pa.fit){let d="";for(let i=0;i<=40;i++){const x=pa.min+(pa.max-pa.min)*i/40;const y=Math.max(1,Math.min(10,pa.fit.f(x)));d+=(i?"L":"M")+sx(x).toFixed(1)+" "+sy(y).toFixed(1)}curve=`<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`}
  const pts=pa.pts.map(o=>`<circle cx="${sx(o.x).toFixed(1)}" cy="${sy(o.y).toFixed(1)}" r="4.5" fill="${scoreColor(o.y)}" fill-opacity=".85" stroke="var(--surface)" stroke-width="1"/>`).join("");
  const line=p.info?"":(()=>{const ex=sx(Math.max(x0,Math.min(x1,pa.est)));const anchor=ex>W-70?"end":"start";return `<line x1="${ex}" x2="${ex}" y1="${T}" y2="${H-B}" stroke="var(--accent)" stroke-width="2"/><text x="${anchor==="end"?ex-4:ex+4}" y="${T+9}" text-anchor="${anchor}" style="fill:var(--accent)">${esc(p.fmt(pa.est))}</text>`})();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota frente a ${p.label}">${g}${curve}${line}${pts}<text x="${L}" y="${H-1}" style="font-size:9px">${p.label}${p.unit?" ("+p.unit+")":""} →</text></svg>`;
}

  if(!withDate.length)return{html:`<div class="card"><div class="label">Frescura del café</div><div class="hint">Añade la fecha de tueste al registrar y ajustaré la receta según los días que tenga el café.</div></div>`,fr:null};

    <div class="fresh-head"><span><span class="fresh-age">${age} días</span> <span class="hint">desde el tueste${withDate.length===1?" · "+esc(b.coffee):""}</span></span><span class="pill" style="background:${fr.color}">${fr.tag}</span></div>

  </div>`;
  return{html,fr};
}

function recipeTiles(m,list,rec,an,notes){

    const fm=esp&&k==="time"?v=>Math.round(v)+" s":p.fmt;
    const lab=esp&&k==="time"?"Parar a los":esp&&k==="bloom"?"Preinfusión":k==="time"?"Tiempo total":k==="grind"?"Molienda":k==="bloomMult"?"Agua bloom":p.label;

function symptomRows(m){
  const r=[["Final amargo",v=>v.finish==="Amargo","bad"],["Inicio ácido",v=>v.start==="Ácido / agrio","bad"],["Astringente",v=>v.finish==="Astringente","bad"]];

  if(m==="V60")r.push(["Drenaje lento",v=>v.flow==="Lento / atascado","bad"]);

}
function cupsChart(list,m){
  const cups=list.slice(0,10).reverse();const n=cups.length;if(!n)return"";
  const rows=symptomRows(m);const L=78,R=6,W=340,bh=70,top=8,rowH=15,gap=10;const H=top+bh+18+rows.length*rowH+4;
  const cw=(W-L-R)/n;const S=cups.map(b=>sens(b).v);

  g+=`<text x="0" y="${top+bh/2+3}">Nota</text>`;
  cups.forEach((b,i)=>{const x=L+i*cw+cw*.18,w=cw*.64,h=b.score/10*bh,last=i===n-1;
    g+=`<rect x="${x.toFixed(1)}" y="${(top+bh-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${scoreColor(b.score)}" opacity="${last?1:.75}"/>`;

    if(last)g+=`<text x="${(x+w/2).toFixed(1)}" y="${top+bh+12}" text-anchor="middle" style="fill:var(--accent);font-weight:600">última</text>`;});

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Nota y sensaciones de tus últimas ${n} tazas">${g}</svg>`;

    case"xchip":f[t.dataset.k]=f[t.dataset.k]===v?null:v;render();break;
    case"pv-n":{const pv=f.pv;const n=Math.max(1,Math.min(8,pv.rows.length+ +v));const bT=parseTime(pv.rows[0]&&pv.rows[0].t)||40;
      pv.rows=Array.from({length:n},()=>({t:"",g:""}));pv.rows[0].t=fmtTime(bT);pv.auto=true;distribute(f);render();break}
    case"pv-redo":f.pv.auto=true;distribute(f);render();break;
    case"pv-usesum":{const s=(num(f.pv.bloomG)||0)+f.pv.rows.reduce((x,r)=>x+(num(r.g)||0),0);f.water=String(s);render();break}
    case"save":{
      if(f.score==null){toast("Falta la nota global");return}
      let pours=null,bloom=num(f.bloom),water=num(f.water);
      if(f.method==="V60"&&f.pv){pours=pvToPours(f.pv);
        if(!pours){toast("Completa los vertidos o pon 1 vertido");return}
        for(let i=1;i<pours.length;i++)if(pours[i].t<=pours[i-1].t){toast("Revisa los tiempos de los vertidos");return}
        bloom=pours[1].t;water=pours.reduce((x,p)=>x+p.g,0)}
      const prev=ui.editingId?store.real.find(x=>x.id===ui.editingId):null;
      const cc=prev?null:currentCoffee(f.method);
      const b={id:ui.editingId||newId(),ts:prev?prev.ts:Date.now(),method:f.method,coffee:cc?cc.name:(f.coffee||"").trim(),roast:cc?(cc.roast||""):(f.roast||""),roastDate:cc?(cc.roastDate||""):(f.roastDate||""),coffeeId:cc?cc.id:(prev&&prev.coffeeId)||null,dose:num(f.dose),water,grind:num(f.grind),temp:f.method==="Espresso"?null:num(f.temp),stopW:f.method==="Espresso"?num(f.stopW):null,time:parseTime(f.time),bloom,pours,score:f.score,acid:f.acid,sweet:f.sweet,bitter:f.bitter,body:f.body,notes:(f.notes||"").trim()};
      const xk=EXTR(f.method).map(x=>x[0]);XKEYS.forEach(k=>{const ok=(SENS.some(x=>x[0]===k)&&!(f.method==="Espresso"&&k==="caught"))||xk.includes(k);b[k]=ok&&f[k]?f[k]:null});
      t.disabled=true;
      try{await saveBrew(b);ui.scan=null;const was=!!ui.editingId;ui.editingId=null;ui.form=blankForm(b.method);ui.sugMethod=b.method;ui.expanded=b.id;toast(was?"Cambios guardados":"Preparación guardada");go("hist")}
      catch(err){t.disabled=false;toast(err&&err.code==="quota_exceeded"?"No queda espacio: borra preparaciones antiguas":"No se pudo guardar. Inténtalo de nuevo")}
      break}
    case"cancel-edit":ui.editingId=null;ui.form=blankForm(f.method);go("hist");break;
    case"hfilter":ui.histFilter=v;ui.expanded=null;render();break;
    case"expand":ui.expanded=ui.expanded===id?null:id;ui.confirmDel=null;render();break;
    case"askdel":ui.confirmDel=id;render();break;
    case"nodel":ui.confirmDel=null;render();break;
    case"del":try{await deleteBrew(id);ui.confirmDel=null;ui.expanded=null;toast("Preparación borrada");render()}catch(err){toast("No se pudo borrar")}break;
    case"edit":{const b=find();if(!b)return;ui.editingId=id;ui.form=formFrom(b);go("new");break}
    case"dup":{const b=find();if(!b)return;ui.editingId=null;const nf=formFrom(b);Object.assign(nf,{score:null,acid:null,sweet:null,bitter:null,body:null,notes:""});XKEYS.forEach(k=>nf[k]=null);ui.form=nf;go("new");toast("Receta cargada");break}
    case"smethod":ui.sugMethod=v;ui.sugScope=null;render();break;
    case"sscope":ui.sugScope=v;render();break;
    case"rtile":ui.rOpen=ui.rOpen===v?null:v;render();break;
    case"go-cafe":go("cafe");break;
    case"eq-edit":ui.eqForm=setup();render();break;
    case"eq-cancel":ui.eqForm=null;render();break;
    case"eq-save":{const d=Object.assign({},setupDoc()||{id:"setup",kind:"setup"},ui.eqForm,{id:"setup",kind:"setup"});try{await saveBrew(d);ui.eqForm=null;toast("Equipo guardado")}catch(err){toast("No se pudo guardar")}render();break}
    case"cf-new":ui.cafeEdit="new";ui.cafeForm={name:"",roast:"",roastDate:"",methods:CMETHODS_ALL.filter(hasMethod).filter(m=>!currentCoffee(m)).slice(0,1)};render();break;
    case"cf-edit":{const c=coffeesAll().find(x=>x.id===id);if(!c)return;ui.cafeEdit=id;ui.cafeForm={name:c.name||"",roast:c.roast||"",roastDate:c.roastDate||"",methods:(c.methods||[]).slice()};render();break}
    case"cf-import":{const b=realBrews().find(x=>x.id===id);if(!b)return;ui.cafeEdit="new";ui.cafeForm={name:b.coffee,roast:b.roast||"",roastDate:b.roastDate||"",methods:currentCoffee(b.method)?[]:[b.method]};render();window.scrollTo(0,0);break}
    case"cf-cancel":ui.cafeEdit=null;ui.cafeForm=null;render();break;
    case"cf-roast":ui.cafeForm.roast=ui.cafeForm.roast===v?"":v;render();break;
    case"cf-m":{const ms=ui.cafeForm.methods;const i=ms.indexOf(v);if(i>=0)ms.splice(i,1);else ms.push(v);render();break}
    case"cf-save":{const cf=ui.cafeForm;if(!(cf.name||"").trim()){toast("Ponle un nombre al café");return}
      const prev=ui.cafeEdit==="new"?null:coffeesAll().find(x=>x.id===ui.cafeEdit);
      const c=Object.assign({},prev||{id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind:"coffee",createdTs:Date.now(),finished:false},{name:cf.name.trim(),roast:cf.roast||"",roastDate:cf.roastDate||""});
      try{await assignCoffee(c,cf.methods.slice());ui.cafeEdit=null;ui.cafeForm=null;toast(prev?"Café actualizado":"Café añadido");render()}catch(err){toast("No se pudo guardar")}break}
    case"cof-m":{const c=coffeesAll().find(x=>x.id===id);if(!c)return;const ms=(c.methods||[]).slice();const i=ms.indexOf(v);if(i>=0)ms.splice(i,1);else ms.push(v);
      try{await assignCoffee(c,ms);toast(i>=0?"Quitado de "+v:c.name+" en uso para "+v)}catch(err){toast("No se pudo guardar")}render();break}
    case"cf-askdone":ui.confirmDel=id;render();break;
    case"cf-done":{const c=coffeesAll().find(x=>x.id===id);if(!c)return;try{await saveBrew(Object.assign({},c,{finished:true,finishedTs:Date.now(),methods:[]}));ui.confirmDel=null;toast("Café terminado")}catch(err){toast("No se pudo guardar")}render();break}
    case"cf-undo":{const c=coffeesAll().find(x=>x.id===id);if(!c)return;try{await saveBrew(Object.assign({},c,{finished:false}))}catch(err){}render();break}
    case"cf-showdone":ui.showDone=!ui.showDone;render();break;
    case"fcoffee":ui.freshCoffee=v;render();break;
    case"cparam":ui.chartParam=v;render();break;
    case"use-sug":{
      const m=ui.sugMethod;const list=brews().filter(b=>b.method===m);const fc=freshCard(m,list);
      const {an,rec}=suggestion(m,sugList(sugBase(m,list).base),ui.applyFresh?fc.fr:null);
      const nf=blankForm(m);nf.method=m;
      const dose=rec.dose!=null?r1(rec.dose):num(nf.dose);if(dose)nf.dose=String(dose);
      if(rec.ratio!=null&&dose)nf.water=String(Math.round(dose*rec.ratio));
      if(rec.grind!=null)nf.grind=String(Math.round(rec.grind*2)/2);if(rec.temp!=null)nf.temp=String(Math.round(rec.temp));
      if(rec.time!=null)nf.time=m==="Espresso"?String(Math.round(rec.time)):fmtTime(Math.round(rec.time/5)*5);
      if(rec.bloom!=null)nf.bloom=String(Math.round(rec.bloom));
      if(m==="V60"){const n=rec.pours!=null?Math.max(1,Math.min(8,Math.round(rec.pours))):3;
        nf.pv={auto:true,mult:rec.bloomMult||2.5,bloomG:"",rows:Array.from({length:n},()=>({t:"",g:""})),bT:rec.bloom!=null?Math.round(rec.bloom/5)*5:40};
        distribute(nf)}
      ui.editingId=null;ui.form=nf;go("new");toast("Receta sugerida cargada");break}
    case"export":{
      const cols=["fecha","metodo","cafe","tueste","fecha_tueste","dias_tueste","dosis_g","agua_g","ratio","molienda_df54","temp_c","tiempo_s","peso_al_parar_g","bloom_s","vertidos","plan_vertidos","nota","acidez","dulzor","amargor","cuerpo","inicio","final","notas_captadas","canalizacion","flujo","pastilla","lecho","notas"];
      const q=s=>{s=s==null?"":String(s);return/[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
      const rows=realBrews().slice().sort((a,b)=>b.ts-a.ts).map(b=>[new Date(b.ts).toISOString(),b.method,b.coffee,b.roast,b.roastDate,ageOf(b),b.dose,b.water,b.dose&&b.water?(b.water/b.dose).toFixed(2):"",b.grind,b.temp,b.time,b.stopW,b.bloom,poursOf(b)?b.pours.length-1:"",pourLine(b),b.score,b.acid,b.sweet,b.bitter,b.body,...(()=>{const v=sens(b).v;return["start","finish","caught","channel","flow","puck","bed"].map(k=>v[k]||"")})(),b.notes].map(q).join(","));
      downloadFile("bitacora-cafe-"+todayISO()+".csv","\ufeff"+[cols.join(","),...rows].join("\n"),"text/csv;charset=utf-8");
      break}
    case"backup":downloadFile("bitacora-cafe-copia-"+todayISO()+".json",JSON.stringify({app:"Bitácora de Café",formato:2,brews:store.real,deleted:store.deleted},null,1),"application/json");break;
    case"d-connect":connectDrive();break;
    case"d-sync":if(tokenValid())sync();else connectDrive();break;
    case"d-off":disconnectDrive();break;
  }
});

$("#app").addEventListener("change",e=>{if(e.target.id==="imp-file"&&e.target.files[0]){importFile(e.target.files[0]);e.target.value=""}});
$("#sync").addEventListener("click",()=>{const st=drive.state;if(st==="off"||st==="expired"||st==="error"||st==="offline"){if(tokenValid())sync();else connectDrive()}else go("cfg")});
$("#gear").addEventListener("click",()=>go(ui.tab==="cfg"?"new":"cfg"));
loadLocal();ui.form=blankForm("V60");render();initDrive();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
